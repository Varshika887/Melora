<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Melora</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <aside class="sidebar">
        <div class="brand">
            <img src="assets/Images/melora-logo.png" alt="Melora Logo">
        </div>

        <nav class="navigation">
            <a href="index.html" class="nav-item">
                <span>⌂</span>
                <p>Home</p>
            </a>
            <a href="explore.html" class="nav-item">
                <span>⌕</span>
                <p>Explore</p>
            </a>
            <a href="my-music.html" class="nav-item">
                <span>♫</span>
                <p>My Music</p>
            </a>
            <a href="my-music.html" class="nav-item">
                <span>♡</span>
                <p>Liked Songs</p>
            </a>
            <a href="friends.html" class="nav-item">
                <span>👥</span>
                <p>Friends</p>
            </a>
            <a href="chat.html" class="nav-item">
                <span>💬</span>
                <p>Chat</p>
            </a>
            <a href="lyra.html" class="nav-item">
                <span>🤖</span>
                <p>Lyra AI</p>
            </a>
        </nav>

        <div class="sidebar-bottom">
            <a href="settings.html" class="nav-item">
                <span>⚙</span>
                <p>Settings</p>
            </a>
            <a href="#" class="nav-item" onclick="handleLogout(event)">
                <span>🚪</span>
                <p>Logout</p>
            </a>
            <a href="profile.html" class="profile-small">
                <div class="avatar" id="sidebarAvatar">V</div>
                <div>
                    <strong id="sidebarName">Varshika</strong>
                    <small>View Profile</small>
                </div>
            </a>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="mobile-brand">
                <img src="assets/Images/melora-logo.png" alt="Melora">
            </div>

            <div class="search-box">
                <span>⌕</span>
                <input type="text" id="searchInput" placeholder="Search music...">
            </div>

            <div class="top-actions">
                <div class="top-profile">
                    <div class="avatar" id="topAvatar">V</div>
                </div>
            </div>
        </header>

        <section class="section" style="max-width: 720px;">
            <div class="section-heading">
                <div>
                    <p class="mini-title">YOUR ACCOUNT</p>
                    <h2>Profile</h2>
                </div>
            </div>

            <div style="background: var(--white); border-radius: 22px; padding: 28px; box-shadow: var(--shadow);">
                <div style="display: flex; align-items: center; gap: 18px; margin-bottom: 24px;">
                    <div class="avatar" id="profileBigAvatar" style="width: 68px; height: 68px; font-size: 26px;">V</div>
                    <div>
                        <h3 id="displayProfileName" style="font-family: Georgia, serif; font-size: 24px;">Varshika</h3>
                        <p id="displayProfileEmail" style="color: var(--sage); font-size: 13px; margin-top: 2px;"></p>
                        <p id="displayProfileBio" style="color: var(--text-light); font-size: 14px; margin-top: 4px;"></p>
                    </div>
                </div>

                <form id="profileForm">
                    <div class="form-group">
                        <label for="profileNameInput">Display Name</label>
                        <input type="text" id="profileNameInput" required>
                    </div>

                    <div class="form-group">
                        <label for="profileEmailInput">Email</label>
                        <input type="email" id="profileEmailInput">
                    </div>

                    <div class="form-group">
                        <label for="profileBioInput">Music Bio / Vibe</label>
                        <input type="text" id="profileBioInput">
                    </div>

                    <button type="submit" class="primary-button">Save Profile</button>
                </form>
            </div>
        </section>
    </main>

    <div class="toast" id="toast">Profile updated</div>

    <script src="js/app.js"></script>
    <script src="js/session.js"></script>
    <script src="js/config.js"></script>
    <script>
        if (typeof checkLogin === "function") {
            checkLogin();
        }

        const PROFILE_KEY = "melora_profile_v1";

        function parseStoredUser() {
            const raw = localStorage.getItem("meloraUser");
            if (!raw) return { name: "Varshika", email: "" };
            try {
                const parsed = JSON.parse(raw);
                if (parsed && typeof parsed === "object") {
                    return {
                        name: parsed.name || "Varshika",
                        email: parsed.email || ""
                    };
                }
            } catch (e) {
                // Plain text string fallback
            }
            return { name: raw, email: "" };
        }

        function loadProfile() {
            const baseUser = parseStoredUser();
            const saved = JSON.parse(localStorage.getItem(PROFILE_KEY) || "null");

            const name = saved?.name || baseUser.name || "Varshika";
            const email = saved?.email || baseUser.email || "";
            const bio = saved?.bio || "Telugu melodies, late-night lo-fi & acoustic vibes 🎵";
            const initial = name.trim().charAt(0).toUpperCase() || "V";

            document.getElementById("profileNameInput").value = name;
            document.getElementById("profileEmailInput").value = email;
            document.getElementById("profileBioInput").value = bio;

            document.getElementById("displayProfileName").textContent = name;
            document.getElementById("displayProfileEmail").textContent = email;
            document.getElementById("displayProfileBio").textContent = bio;
            document.getElementById("sidebarName").textContent = name;

            ["sidebarAvatar", "topAvatar", "profileBigAvatar"].forEach((id) => {
                const el = document.getElementById(id);
                if (el) el.textContent = initial;
            });
        }

        document.getElementById("profileForm").addEventListener("submit", function (e) {
            e.preventDefault();
            const name = document.getElementById("profileNameInput").value.trim() || "Varshika";
            const email = document.getElementById("profileEmailInput").value.trim();
            const bio = document.getElementById("profileBioInput").value.trim();

            localStorage.setItem(PROFILE_KEY, JSON.stringify({ name, email, bio }));
            loadProfile();

            if (typeof showToast === "function") {
                showToast("Profile saved ✓");
            }
        });

        document.addEventListener("DOMContentLoaded", loadProfile);
    </script>
</body>

</html>
